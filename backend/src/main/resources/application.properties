server.port=8095

spring.application.name=burnar-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/your_db
spring.datasource.username=your_username
spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=burnar

# Админы как Delphi NarListUnit (burnar_role, ievc) + burnar_web → ROLE_ADMIN.
burnar.admin-users[0]=burnar_role
burnar.admin-users[1]=ievc
burnar.admin-users[2]=burnar_web

# Пункты Select «структура» (Delphi LoadCBX).
burnar.org-filter-ids[0]=4
burnar.org-filter-ids[1]=5
burnar.org-filter-ids[2]=6
burnar.org-filter-ids[3]=7
burnar.org-filter-ids[4]=8
