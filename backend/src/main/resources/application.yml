server:
  port: 8095

spring:
  application:
    name: burnar-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/your_db
    username: your_username
    password: your_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: burnar

# Админы как Delphi NarListUnit (burnar_role, ievc) + burnar_web → ROLE_ADMIN.
# org-filter-ids — пункты Select «структура» (Delphi LoadCBX).
burnar:
  admin-users:
    - burnar_role
    - ievc
    - burnar_web
  org-filter-ids:
    - 4
    - 5
    - 6
    - 7
    - 8
